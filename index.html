<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClientFlow — Client Onboarding Operations</title>
  <meta name="description" content="ClientFlow is a client onboarding operations platform for tracking workflow, tasks, approvals, documents, and project health." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root{
      --bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--nav:#0b1220;--nav2:#121c2f;--text:#122033;--muted:#697386;--line:#e5eaf0;--primary:#2563eb;--primary2:#1d4ed8;--green:#15803d;--amber:#b45309;--red:#b42318;--purple:#6d28d9;--shadow:0 14px 35px rgba(15,23,42,.06);--radius:18px
    }
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text)}
    button,input,select{font:inherit} button{cursor:pointer}
    .app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
    .sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,var(--nav),#101a2d);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:11px;padding:0 10px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
    .brandmark{width:36px;height:36px;border-radius:11px;background:linear-gradient(145deg,#3b82f6,#1d4ed8);display:grid;place-items:center;box-shadow:0 8px 20px rgba(37,99,235,.3)}
    .brandtext strong{display:block;font-size:17px}.brandtext span{font-size:11px;color:#93a4bd}
    .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:#6f829f;margin:22px 10px 8px}
    .nav{display:flex;flex-direction:column;gap:5px}.nav button{display:flex;gap:11px;align-items:center;width:100%;padding:11px 12px;border:0;border-radius:11px;background:transparent;color:#aebdd1;text-align:left;font-size:13px;font-weight:600;transition:.15s}.nav button:hover,.nav button.active{background:#17243a;color:#fff}.nav button.active{box-shadow:inset 3px 0 0 #4f8cff}
    .sidebar-foot{margin-top:auto;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:12px}.sidebar-foot .avatar{width:34px;height:34px;border-radius:50%;background:#dbeafe;color:#1d4ed8;display:grid;place-items:center;font-weight:800}.sidebar-foot small{color:#8da0b8}
    .main{min-width:0}.topbar{height:70px;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20}
    .crumb{font-size:13px;color:var(--muted)}.top-actions{display:flex;align-items:center;gap:10px}.icon-btn{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:11px;display:grid;place-items:center;color:#536174}
    .content{padding:28px}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}.page-head h1{margin:0;font-size:28px;letter-spacing:-.03em}.page-head p{margin:6px 0 0;color:var(--muted);font-size:13px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:#7a889b;font-weight:700;margin-bottom:6px}
    .btn{border:0;border-radius:11px;padding:10px 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(37,99,235,.22)}.btn.primary:hover{background:var(--primary2)}.btn.secondary{background:#fff;border:1px solid var(--line);color:var(--text)}
    .grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}.kpi{position:relative;overflow:hidden}.kpi .icon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:#eff6ff;color:#2563eb;margin-bottom:16px}.kpi:nth-child(2) .icon{background:#fff7ed;color:#c2410c}.kpi:nth-child(3) .icon{background:#ecfdf3;color:#15803d}.kpi:nth-child(4) .icon{background:#fef2f2;color:#b42318}.kpi-label{font-size:12px;color:var(--muted);font-weight:600}.kpi-value{font-size:28px;font-weight:800;letter-spacing:-.04em;margin-top:5px}.delta{font-size:11px;margin-top:6px;color:#738095}.delta.good{color:var(--green)}.delta.bad{color:var(--red)}
    .split{grid-template-columns:minmax(0,1.85fr) minmax(280px,.8fr)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.section-head h3{font-size:15px;margin:0}.section-head .muted{font-size:12px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:15px}.input,.select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:13px;color:var(--text);outline:none}.input:focus,.select:focus{border-color:#93b4ff;box-shadow:0 0 0 3px #eef4ff}.input{min-width:260px}
    .table-wrap{overflow:auto} table{width:100%;border-collapse:collapse} th{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:#8390a2;font-weight:700;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #edf1f5;font-size:12.5px;vertical-align:middle}tr:last-child td{border-bottom:0}tr.click{cursor:pointer}tr.click:hover{background:#fafcff}.client-cell strong{display:block;font-size:13px}.client-cell span{font-size:11px;color:var(--muted);margin-top:3px;display:block}
    .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;font-size:10.5px;font-weight:700;white-space:nowrap}.pill.blue{background:#eff6ff;color:#1d4ed8}.pill.green{background:#ecfdf3;color:#15803d}.pill.amber{background:#fff7ed;color:#b45309}.pill.red{background:#fef2f2;color:#b42318}.pill.gray{background:#f1f5f9;color:#526173}.pill.purple{background:#f5f3ff;color:#6d28d9}
    .dot{width:6px;height:6px;border-radius:50%;background:currentColor}.progress{height:7px;background:#e8edf3;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#2563eb,#4f8cff);border-radius:inherit}.progress-line{display:flex;align-items:center;gap:9px;min-width:120px}.progress-line b{font-size:10px;color:#667085;width:30px}
    .workflow-list{display:flex;flex-direction:column;gap:12px}.workflow-row{display:grid;grid-template-columns:115px 1fr 28px;align-items:center;gap:10px}.workflow-row span{font-size:12px}.workflow-row b{font-size:12px;text-align:right}.bar{height:7px;background:#edf1f5;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:#8fb2ff;border-radius:999px}
    .activity{display:flex;flex-direction:column}.activity-item{display:grid;grid-template-columns:34px 1fr;gap:11px;padding:11px 0;border-bottom:1px solid #edf1f5}.activity-item:last-child{border-bottom:0}.activity-icon{width:32px;height:32px;border-radius:10px;background:#f1f5f9;display:grid;place-items:center;color:#64748b}.activity-item strong{font-size:12.5px}.activity-item small{display:block;color:var(--muted);font-size:10.5px;margin-top:3px}
    .stagebar{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stage{position:relative;padding-top:24px;font-size:11px;color:#8793a3;text-align:center}.stage:before{content:"";position:absolute;top:6px;left:0;right:0;height:5px;background:#e7ecf2;border-radius:999px}.stage.done:before{background:#22c55e}.stage.current:before{background:#2563eb}.stage.current{color:#1d4ed8;font-weight:800}.stage.done{color:#26743d;font-weight:700}
    .detail-hero{display:grid;grid-template-columns:1.5fr .8fr;gap:16px;margin-bottom:16px}.detail-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.meta-box{background:#f8fafc;border:1px solid #edf1f5;padding:12px;border-radius:12px}.meta-box label{font-size:10px;text-transform:uppercase;color:#8a96a7;font-weight:700;display:block;margin-bottom:5px}.meta-box strong{font-size:12.5px}.health{padding:16px;border-radius:15px;background:linear-gradient(145deg,#f8fbff,#eff6ff);border:1px solid #dbeafe}.health .score{font-size:30px;font-weight:800}.health small{color:#65758b}.health .status{margin-top:10px}
    .metric-grid{grid-template-columns:repeat(3,1fr)}.metric{padding:17px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(#fff,#fbfdff)}.metric .value{font-size:27px;font-weight:800;letter-spacing:-.04em;margin-top:6px}.metric .label{font-size:11px;color:var(--muted);font-weight:600}
    .chart-row{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:12px}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}.chart-bar{width:100%;max-width:42px;background:linear-gradient(180deg,#4f8cff,#2563eb);border-radius:8px 8px 3px 3px;min-height:8px}.chart-col label{font-size:10px;color:#7b8797}.chart-col b{font-size:10px}
    .empty{padding:28px;text-align:center;color:var(--muted);font-size:12px}.modal{position:fixed;inset:0;background:rgba(10,17,30,.58);display:flex;align-items:center;justify-content:center;padding:18px;z-index:100}.modal-box{background:#fff;border-radius:20px;width:min(700px,96vw);max-height:86vh;overflow:auto;box-shadow:0 25px 70px rgba(15,23,42,.28);padding:22px}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:19px;margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:17px}.form-grid label{font-size:11px;font-weight:600;color:#68768a;display:flex;flex-direction:column;gap:7px}.form-grid input,.form-grid select{padding:10px 11px;border:1px solid var(--line);border-radius:10px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.muted{color:var(--muted)}.small{font-size:11px}.spacer{height:16px}.mobile-toggle{display:none}
    @media(max-width:1050px){.kpis{grid-template-columns:repeat(2,1fr)}.split,.detail-hero{grid-template-columns:1fr}.detail-meta{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:760px){.app{display:block}.sidebar{position:fixed;left:-260px;z-index:80;width:250px;transition:.2s}.sidebar.open{left:0}.mobile-toggle{display:grid}.topbar{padding:0 16px}.content{padding:18px}.kpis,.metric-grid{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.stagebar{grid-template-columns:repeat(3,1fr)}.detail-meta,.form-grid{grid-template-columns:1fr}.input{min-width:100%}.top-actions .profile-copy{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brandmark"><i data-lucide="workflow" size="19"></i></div><div class="brandtext"><strong>ClientFlow</strong><span>Onboarding Operations</span></div></div>
    <div class="nav-label">Workspace</div><div class="nav" id="nav"></div>
    <div class="sidebar-foot"><div style="display:flex;gap:10px;align-items:center"><div class="avatar">RK</div><div><div style="font-size:12px;font-weight:700">Revant K.</div><small>Project Manager</small></div></div></div>
  </aside>
  <section class="main">
    <div class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="icon-btn mobile-toggle" onclick="toggleNav()"><i data-lucide="menu" size="17"></i></button><div class="crumb">Client Operations / <span id="crumb">Dashboard</span></div></div><div class="top-actions"><button class="icon-btn"><i data-lucide="search" size="17"></i></button><button class="icon-btn"><i data-lucide="bell" size="17"></i></button><div class="profile-copy" style="font-size:12px;text-align:right"><strong style="display:block">Portfolio Demo</strong><span class="muted">Simulation data</span></div></div></div>
    <main class="content" id="main"></main>
  </section>
</div>
<div id="modalRoot"></div>
<script>
const STAGES=['Intake','Documentation','Review','Approval','Setup','Complete'];
const seed={clients:[
{id:1,name:'Apex Manufacturing',owner:'Maya Chen',stage:'Review',start:'2026-09-18',target:'2026-10-09',progress:58,risk:'Medium',industry:'Industrial',contact:'Jordan Lee',email:'jlee@apex.example',region:'Central'},
{id:2,name:'Northstar Health',owner:'Daniel Ruiz',stage:'Documentation',start:'2026-09-24',target:'2026-10-14',progress:34,risk:'Low',industry:'Healthcare',contact:'Priya Shah',email:'pshah@northstar.example',region:'East'},
{id:3,name:'Summit Logistics',owner:'Maya Chen',stage:'Approval',start:'2026-09-12',target:'2026-10-06',progress:76,risk:'High',industry:'Logistics',contact:'Mark Davis',email:'mdavis@summit.example',region:'South'},
{id:4,name:'BluePeak Retail',owner:'Emma Brooks',stage:'Setup',start:'2026-09-08',target:'2026-10-04',progress:88,risk:'Medium',industry:'Retail',contact:'Sofia Martinez',email:'smartinez@bluepeak.example',region:'West'},
{id:5,name:'Redwood Analytics',owner:'Daniel Ruiz',stage:'Intake',start:'2026-10-02',target:'2026-10-23',progress:12,risk:'Low',industry:'Technology',contact:'Alex Kim',email:'akim@redwood.example',region:'Central'},
{id:6,name:'Harbor Financial',owner:'Emma Brooks',stage:'Complete',start:'2026-08-21',target:'2026-09-19',progress:100,risk:'Low',industry:'Financial Services',contact:'Taylor Grant',email:'tgrant@harbor.example',region:'East'}],
tasks:[
{id:1,clientId:1,title:'Compliance review',owner:'Compliance Team',due:'2026-10-06',priority:'High',status:'In Progress'},
{id:2,clientId:1,title:'Validate tax documentation',owner:'Maya Chen',due:'2026-10-07',priority:'Medium',status:'Not Started'},
{id:3,clientId:2,title:'Collect W-9',owner:'Daniel Ruiz',due:'2026-10-05',priority:'High',status:'Overdue'},
{id:4,clientId:3,title:'Executive approval',owner:'Sarah Mitchell',due:'2026-10-06',priority:'High',status:'Blocked'},
{id:5,clientId:4,title:'Provision account access',owner:'IT Ops',due:'2026-10-05',priority:'Medium',status:'In Progress'},
{id:6,clientId:5,title:'Verify intake form',owner:'Daniel Ruiz',due:'2026-10-08',priority:'Low',status:'Not Started'}],
docs:[{id:1,clientId:1,name:'W-9',status:'Approved'},{id:2,clientId:1,name:'MSA',status:'Received'},{id:3,clientId:2,name:'W-9',status:'Missing'},{id:4,clientId:3,name:'Compliance Certification',status:'Approved'},{id:5,clientId:4,name:'Implementation Checklist',status:'Received'}],
approvals:[{id:1,clientId:3,type:'Executive Approval',owner:'Sarah Mitchell',status:'Pending',submitted:'2026-10-04'},{id:2,clientId:1,type:'Compliance Sign-off',owner:'Compliance Team',status:'In Review',submitted:'2026-10-05'},{id:3,clientId:4,type:'Final Setup Approval',owner:'IT Ops',status:'Approved',submitted:'2026-10-03'}],
activity:[{date:'2026-10-06',text:'Summit Logistics approval escalated to sponsor.',type:'alert'},{date:'2026-10-05',text:'Apex Manufacturing entered Review stage.',type:'workflow'},{date:'2026-10-05',text:'Northstar Health W-9 became overdue.',type:'alert'},{date:'2026-10-04',text:'BluePeak Retail setup access provisioned.',type:'setup'}]};
let db=JSON.parse(localStorage.getItem('clientflow-db-v2')||'null')||seed; const save=()=>localStorage.setItem('clientflow-db-v2',JSON.stringify(db));
const routes=[['Dashboard','layout-dashboard'],['Clients','building-2'],['Tasks','list-checks'],['Documents','files'],['Approvals','badge-check'],['Reports','chart-no-axes-combined'],['Activity','history']];let route='Dashboard';
const nav=document.getElementById('nav'),main=document.getElementById('main');
function toggleNav(){document.getElementById('sidebar').classList.toggle('open')}
function renderNav(){nav.innerHTML=routes.map(([r,icon])=>`<button class="${r===route?'active':''}" onclick="route='${r}';document.getElementById('sidebar').classList.remove('open');render()"><i data-lucide="${icon}" size="16"></i>${r}</button>`).join('')}
function pill(s){let c='gray';if(['Complete','Approved','Low'].includes(s))c='green';else if(['Overdue','Blocked','Missing','High','Rejected'].includes(s))c='red';else if(['In Progress','In Review','Pending','Medium','Received'].includes(s))c='amber';else if(['Review','Approval','Setup'].includes(s))c='blue';else if(s==='Documentation')c='purple';return `<span class="pill ${c}"><span class="dot"></span>${s}</span>`}
function clientName(id){return db.clients.find(c=>c.id===id)?.name||'Unknown'}
function head(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">ClientFlow Workspace</div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function clientTable(arr){return `<div class="table-wrap"><table><thead><tr><th>Client</th><th>Owner</th><th>Stage</th><th>Target</th><th>Progress</th><th>Risk</th></tr></thead><tbody>${arr.map(c=>`<tr class="click" onclick="showClient(${c.id})"><td class="client-cell"><strong>${c.name}</strong><span>${c.industry}</span></td><td>${c.owner}</td><td>${pill(c.stage)}</td><td>${fmt(c.target)}</td><td><div class="progress-line"><div class="progress" style="flex:1"><span style="width:${c.progress}%"></span></div><b>${c.progress}%</b></div></td><td>${pill(c.risk)}</td></tr>`).join('')}</tbody></table></div>`}
function fmt(d){if(!d)return '—';const x=new Date(d+'T00:00:00');return x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}
function renderDashboard(){const active=db.clients.filter(c=>c.stage!=='Complete'),overdue=db.tasks.filter(t=>t.status==='Overdue').length,avg=Math.round(active.reduce((a,c)=>a+c.progress,0)/Math.max(active.length,1)),atRisk=active.filter(c=>c.risk==='High').length;main.innerHTML=head('Dashboard','Monitor onboarding health, execution risk, and delivery progress.',`<button class="btn primary" onclick="openClientModal()"><i data-lucide="plus" size="15"></i>New Client</button>`)+`
<div class="grid kpis"><div class="card kpi"><div class="icon"><i data-lucide="users" size="18"></i></div><div class="kpi-label">Active onboardings</div><div class="kpi-value">${active.length}</div><div class="delta good">↑ 2 started this month</div></div><div class="card kpi"><div class="icon"><i data-lucide="triangle-alert" size="18"></i></div><div class="kpi-label">Overdue tasks</div><div class="kpi-value">${overdue}</div><div class="delta ${overdue?'bad':'good'}">${overdue?'Needs owner attention':'No overdue work'}</div></div><div class="card kpi"><div class="icon"><i data-lucide="gauge" size="18"></i></div><div class="kpi-label">Avg. completion</div><div class="kpi-value">${avg}%</div><div class="delta good">Across active clients</div></div><div class="card kpi"><div class="icon"><i data-lucide="shield-alert" size="18"></i></div><div class="kpi-label">High-risk clients</div><div class="kpi-value">${atRisk}</div><div class="delta ${atRisk?'bad':'good'}">${atRisk?'Escalation recommended':'Portfolio healthy'}</div></div></div>
<div class="grid split"><div class="card"><div class="section-head"><h3>Active onboarding portfolio</h3><span class="muted">${active.length} active clients</span></div>${clientTable(active.slice(0,6))}</div><div class="card"><div class="section-head"><h3>Workflow distribution</h3><span class="muted">Current stage</span></div><div class="workflow-list">${STAGES.map(s=>{const n=db.clients.filter(c=>c.stage===s).length,p=Math.max(8,(n/db.clients.length)*100);return `<div class="workflow-row"><span>${s}</span><div class="bar"><span style="width:${p}%"></span></div><b>${n}</b></div>`}).join('')}</div><div class="spacer"></div><div class="section-head"><h3>Upcoming attention</h3></div>${db.tasks.filter(t=>['Overdue','Blocked'].includes(t.status)).slice(0,3).map(t=>`<div style="padding:10px 0;border-top:1px solid #edf1f5"><div style="font-size:12px;font-weight:700">${t.title}</div><div class="small muted" style="margin-top:4px">${clientName(t.clientId)} • ${t.owner}</div></div>`).join('')||'<div class="empty">No escalations</div>'}</div></div>
<div class="card" style="margin-top:16px"><div class="section-head"><h3>Recent activity</h3><span class="muted">Latest project changes</span></div>${activityList(db.activity.slice(0,5))}</div>`}
function renderClients(){main.innerHTML=head('Clients','Track every onboarding from intake through completion.',`<button class="btn primary" onclick="openClientModal()"><i data-lucide="plus" size="15"></i>New Client</button>`)+`<div class="card"><div class="toolbar"><input id="clientSearch" class="input" placeholder="Search client or owner..." oninput="filterClients()"><select id="stageFilter" class="select" onchange="filterClients()"><option value="">All stages</option>${STAGES.map(s=>`<option>${s}</option>`).join('')}</select><select id="riskFilter" class="select" onchange="filterClients()"><option value="">All risks</option><option>Low</option><option>Medium</option><option>High</option></select></div><div id="clientTable">${clientTable(db.clients)}</div></div>`}
function filterClients(){const q=document.getElementById('clientSearch').value.toLowerCase(),s=document.getElementById('stageFilter').value,r=document.getElementById('riskFilter').value;const arr=db.clients.filter(c=>(!q||c.name.toLowerCase().includes(q)||c.owner.toLowerCase().includes(q))&&(!s||c.stage===s)&&(!r||c.risk===r));document.getElementById('clientTable').innerHTML=clientTable(arr)}
function renderTasks(){main.innerHTML=head('Tasks','Manage ownership, due dates, priority, and task health.')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Task</th><th>Client</th><th>Owner</th><th>Due</th><th>Priority</th><th>Status</th><th>Update</th></tr></thead><tbody>${db.tasks.map(t=>`<tr><td><strong>${t.title}</strong></td><td>${clientName(t.clientId)}</td><td>${t.owner}</td><td>${fmt(t.due)}</td><td>${pill(t.priority)}</td><td>${pill(t.status)}</td><td><select class="select" onchange="updateTask(${t.id},this.value)">${['Not Started','In Progress','Blocked','Overdue','Complete'].map(s=>`<option ${s===t.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function updateTask(id,v){const t=db.tasks.find(t=>t.id===id);t.status=v;db.activity.unshift({date:new Date().toISOString().slice(0,10),text:`Task “${t.title}” changed to ${v}.`,type:'workflow'});save();render()}
function renderDocs(){main.innerHTML=head('Documents','Track required onboarding documents and review status.')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Document</th><th>Client</th><th>Status</th><th>Update</th></tr></thead><tbody>${db.docs.map(d=>`<tr><td><strong>${d.name}</strong></td><td>${clientName(d.clientId)}</td><td>${pill(d.status)}</td><td><select class="select" onchange="updateDoc(${d.id},this.value)">${['Missing','Received','Approved'].map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function updateDoc(id,v){db.docs.find(d=>d.id===id).status=v;save();render()}
function renderApprovals(){main.innerHTML=head('Approvals','Monitor items waiting on review and sign-off.')+`<div class="card"><div class="table-wrap"><table><thead><tr><th>Approval</th><th>Client</th><th>Owner</th><th>Submitted</th><th>Status</th><th>Update</th></tr></thead><tbody>${db.approvals.map(a=>`<tr><td><strong>${a.type}</strong></td><td>${clientName(a.clientId)}</td><td>${a.owner}</td><td>${fmt(a.submitted)}</td><td>${pill(a.status)}</td><td><select class="select" onchange="updateApproval(${a.id},this.value)">${['Pending','In Review','Approved','Rejected'].map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div></div>`}
function updateApproval(id,v){db.approvals.find(a=>a.id===id).status=v;save();render()}
function renderReports(){const complete=db.clients.filter(c=>c.stage==='Complete').length,taskDone=db.tasks.filter(t=>t.status==='Complete').length,open=db.approvals.filter(a=>a.status!=='Approved').length;main.innerHTML=head('Reports','Operational visibility into onboarding performance and bottlenecks.')+`<div class="grid metric-grid"><div class="metric"><div class="label">Client completion rate</div><div class="value">${Math.round(complete/db.clients.length*100)}%</div><div class="delta">Target: 90%+</div></div><div class="metric"><div class="label">Task completion rate</div><div class="value">${Math.round(taskDone/db.tasks.length*100)}%</div><div class="delta">Across current work items</div></div><div class="metric"><div class="label">Open approvals</div><div class="value">${open}</div><div class="delta">Awaiting final disposition</div></div></div><div class="grid split" style="margin-top:16px"><div class="card"><div class="section-head"><h3>Stage volume</h3><span class="muted">Clients by workflow stage</span></div><div class="chart-row">${STAGES.map(s=>{let n=db.clients.filter(c=>c.stage===s).length,h=Math.max(12,(n/Math.max(...STAGES.map(x=>db.clients.filter(c=>c.stage===x).length),1))*135);return `<div class="chart-col"><b>${n}</b><div class="chart-bar" style="height:${h}px"></div><label>${s}</label></div>`}).join('')}</div></div><div class="card"><div class="section-head"><h3>Operational health</h3></div><div class="workflow-list"><div class="workflow-row"><span>On-time tasks</span><div class="bar"><span style="width:76%"></span></div><b>76%</b></div><div class="workflow-row"><span>Docs received</span><div class="bar"><span style="width:82%"></span></div><b>82%</b></div><div class="workflow-row"><span>Approvals cleared</span><div class="bar"><span style="width:67%"></span></div><b>67%</b></div><div class="workflow-row"><span>Target SLA</span><div class="bar"><span style="width:91%"></span></div><b>91%</b></div></div></div></div>`}
function activityList(arr){return `<div class="activity">${arr.map(a=>`<div class="activity-item"><div class="activity-icon"><i data-lucide="${a.type==='alert'?'triangle-alert':a.type==='setup'?'settings-2':'git-branch'}" size="15"></i></div><div><strong>${a.text}</strong><small>${fmt(a.date)}</small></div></div>`).join('')}</div>`}
function renderActivity(){main.innerHTML=head('Activity Log','Audit trail of onboarding changes and key events.')+`<div class="card">${activityList(db.activity)}</div>`}
function showClient(id){const c=db.clients.find(x=>x.id===id),idx=STAGES.indexOf(c.stage),clientTasks=db.tasks.filter(t=>t.clientId===id),blocked=clientTasks.filter(t=>['Blocked','Overdue'].includes(t.status)).length,health=Math.max(45,100-blocked*22-(c.risk==='High'?18:c.risk==='Medium'?8:0));main.innerHTML=head(c.name,`${c.industry} • ${c.region||'US'} region`,`<button class="btn secondary" onclick="route='Clients';render()"><i data-lucide="arrow-left" size="15"></i>Back to Clients</button>`)+`<div class="detail-hero"><div class="card"><div class="section-head"><h3>Onboarding workflow</h3><span class="pill blue"><span class="dot"></span>${c.progress}% complete</span></div><div class="stagebar">${STAGES.map((s,i)=>`<div class="stage ${i<idx?'done':i===idx?'current':''}">${s}</div>`).join('')}</div><div class="detail-meta"><div class="meta-box"><label>Owner</label><strong>${c.owner}</strong></div><div class="meta-box"><label>Primary contact</label><strong>${c.contact}</strong></div><div class="meta-box"><label>Target date</label><strong>${fmt(c.target)}</strong></div><div class="meta-box"><label>Risk</label>${pill(c.risk)}</div></div></div><div class="health"><div class="eyebrow">Onboarding health</div><div class="score">${health}</div><small>Composite portfolio score / 100</small><div class="status">${health>=80?pill('Low'):health>=60?pill('Medium'):pill('High')}</div><div style="margin-top:15px;font-size:11px;color:#5e6f85;line-height:1.6">Based on open blockers, due dates, current risk, and workflow completion.</div></div></div><div class="grid split"><div class="card"><div class="section-head"><h3>Tasks & dependencies</h3><span class="muted">${clientTasks.length} work items</span></div>${clientTasks.length?`<div class="table-wrap"><table><thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>${clientTasks.map(t=>`<tr><td><strong>${t.title}</strong></td><td>${t.owner}</td><td>${fmt(t.due)}</td><td>${pill(t.status)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No tasks assigned</div>'}</div><div class="card"><div class="section-head"><h3>Client profile</h3></div><div style="display:grid;gap:13px"><div><div class="small muted">Contact</div><div style="font-size:12px;font-weight:700;margin-top:3px">${c.contact}</div></div><div><div class="small muted">Email</div><div style="font-size:12px;font-weight:700;margin-top:3px">${c.email||'—'}</div></div><div><div class="small muted">Start date</div><div style="font-size:12px;font-weight:700;margin-top:3px">${fmt(c.start)}</div></div><div><div class="small muted">Target date</div><div style="font-size:12px;font-weight:700;margin-top:3px">${fmt(c.target)}</div></div></div><div class="section-head" style="margin-top:20px"><h3>Documents</h3></div>${db.docs.filter(d=>d.clientId===id).map(d=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #edf1f5"><span style="font-size:12px">${d.name}</span>${pill(d.status)}</div>`).join('')||'<div class="empty">No documents</div>'}<div class="section-head" style="margin-top:20px"><h3>Approvals</h3></div>${db.approvals.filter(a=>a.clientId===id).map(a=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid #edf1f5"><span style="font-size:12px">${a.type}</span>${pill(a.status)}</div>`).join('')||'<div class="empty">No approvals</div>'}</div></div>`;finishRender()}
function openClientModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="modal-box"><div class="modal-head"><div><div class="eyebrow">Create onboarding</div><h2>New Client</h2></div><button class="icon-btn" onclick="closeModal()"><i data-lucide="x" size="17"></i></button></div><div class="form-grid"><label>Client name<input id="nName" placeholder="e.g., Meridian Partners"></label><label>Industry<input id="nIndustry" placeholder="e.g., Financial Services"></label><label>Owner<input id="nOwner" placeholder="e.g., Maya Chen"></label><label>Primary contact<input id="nContact" placeholder="e.g., Jordan Lee"></label><label>Start date<input id="nStart" type="date"></label><label>Target date<input id="nTarget" type="date"></label><label>Stage<select id="nStage">${STAGES.map(s=>`<option>${s}</option>`).join('')}</select></label><label>Risk<select id="nRisk"><option>Low</option><option>Medium</option><option>High</option></select></label></div><div class="actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createClient()">Create Client</button></div></div></div>`;lucide.createIcons()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function createClient(){const vals=['nName','nIndustry','nOwner','nContact','nStart','nTarget'].map(id=>document.getElementById(id).value);if(!vals[0])return alert('Client name is required');const stage=document.getElementById('nStage').value;db.clients.push({id:Date.now(),name:vals[0],industry:vals[1]||'Other',owner:vals[2]||'Unassigned',contact:vals[3]||'N/A',email:'',region:'Central',start:vals[4]||new Date().toISOString().slice(0,10),target:vals[5]||'',stage,risk:document.getElementById('nRisk').value,progress:Math.min(100,Math.max(5,STAGES.indexOf(stage)*20))});db.activity.unshift({date:new Date().toISOString().slice(0,10),text:`${vals[0]} onboarding created.`,type:'workflow'});save();closeModal();route='Clients';render()}
function finishRender(){document.getElementById('crumb').textContent=route;lucide.createIcons()}
function render(){renderNav();({Dashboard:renderDashboard,Clients:renderClients,Tasks:renderTasks,Documents:renderDocs,Approvals:renderApprovals,Reports:renderReports,Activity:renderActivity}[route])();finishRender()}
render();
</script>
</body>
</html>
